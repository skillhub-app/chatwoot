name: Sprint v71 spec (consolidated fixes + LLM fallback)

permissions:
  contents: read

on:
  push:
    branches:
      - sprint-v71-consolidation
    paths:
      - 'app/controllers/api/v1/accounts/kanban/automations_controller.rb'
      - 'app/services/kanban/execute_action_service.rb'
      - 'app/services/ai_agent/google_calendar/invalid_grant_monitor.rb'
      - 'app/services/ai_agent/google_calendar/api_client.rb'
      - 'app/jobs/ai_agent/process_message_job.rb'
      - 'app/services/ai_agent/activity_service.rb'
      - 'app/services/ai_agent/llm_router_service.rb'
      - 'app/javascript/dashboard/components/aiAgent/AiAgentToggle.vue'
      - 'spec/**'
      - 'app/javascript/dashboard/components/aiAgent/AiAgentToggle.spec.js'
      - '.github/workflows/sprint_v71_spec.yml'
  pull_request:
  workflow_dispatch:

jobs:
  sprint-v71-ruby-specs:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    env:
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Create database
        run: bundle exec rake db:create

      - name: Load schema
        run: bundle exec rake db:schema:load

      - name: Run sprint v71 specs (fixes + feature)
        run: |
          bundle exec rspec --format progress \
            spec/controllers/api/v1/accounts/kanban/automations_update_spec.rb \
            spec/services/kanban/execute_action_service_spec.rb \
            spec/services/ai_agent/google_calendar/invalid_grant_monitor_spec.rb \
            spec/services/ai_agent/google_calendar/api_client_spec.rb \
            spec/jobs/ai_agent/process_message_job_error_handling_spec.rb \
            spec/services/ai_agent/llm_router_service_spec.rb

      - name: Run regression specs (v61-v70 não pode quebrar)
        run: |
          bundle exec rspec --format progress \
            spec/services/kanban/execute_action_service_followup_sanitizer_spec.rb \
            spec/jobs/ai_agent/process_message_job_injection_spec.rb \
            spec/services/ai_agent/llm_service_gemini_spec.rb \
            spec/services/ai_agent/message_humanizer_spec.rb \
            spec/services/ai_agent/message_humanizer_atomicity_spec.rb \
            spec/services/whatsapp/providers/audio_atomicity_regression_spec.rb \
            spec/services/ai_agent/activity_service_spec.rb \
            spec/services/ai_agent/toggle_sync_spec.rb \
            spec/controllers/api/v1/accounts/conversations/ai_agent_state_controller_spec.rb \
            spec/services/ai_agent/incoming_message_processor_spec.rb \
            spec/models/message_soft_delete_spec.rb \
            spec/services/channel_uazapi/revoke_message_service_spec.rb \
            spec/controllers/api/v1/accounts/conversations/messages_controller_destroy_spec.rb

  sprint-v71-frontend-spec:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Run eslint on changed files
        run: |
          pnpm exec eslint \
            app/javascript/dashboard/components/aiAgent/AiAgentToggle.vue \
            app/javascript/dashboard/components/aiAgent/AiAgentToggle.spec.js

      - name: Run AiAgentToggle spec (bug I — live refresh)
        run: TZ=UTC pnpm exec vitest run app/javascript/dashboard/components/aiAgent/AiAgentToggle.spec.js
