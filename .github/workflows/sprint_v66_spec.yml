name: Sprint v66 spec (follow-up scaffold sanitizer)

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'app/services/kanban/execute_action_service.rb'
      - 'app/services/ai_agent/follow_up_prompt_parser.rb'
      - 'app/services/ai_agent/follow_up_output_sanitizer.rb'
      - 'spec/services/ai_agent/follow_up_output_sanitizer_spec.rb'
      - 'spec/services/ai_agent/follow_up_prompt_parser_spec.rb'
      - 'spec/services/kanban/execute_action_service_followup_sanitizer_spec.rb'
      - '.github/workflows/sprint_v66_spec.yml'
  pull_request:
  workflow_dispatch:

jobs:
  sprint-v66-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    env:
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Create database
        run: bundle exec rake db:create

      - name: Load schema
        run: bundle exec rake db:schema:load

      - name: Run sprint v66 specs
        run: |
          bundle exec rspec --format progress \
            spec/services/ai_agent/follow_up_output_sanitizer_spec.rb \
            spec/services/ai_agent/follow_up_prompt_parser_spec.rb \
            spec/services/kanban/execute_action_service_followup_sanitizer_spec.rb
