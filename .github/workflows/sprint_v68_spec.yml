name: Sprint v68 spec (soft delete + Uazapi revoke)

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'app/controllers/api/v1/accounts/conversations/messages_controller.rb'
      - 'app/models/message.rb'
      - 'app/services/channel_uazapi/**'
      - 'db/migrate/20260627000001_add_soft_delete_to_messages.rb'
      - 'spec/services/channel_uazapi/**'
      - 'spec/models/message_soft_delete_spec.rb'
      - 'spec/controllers/api/v1/accounts/conversations/messages_controller_destroy_spec.rb'
      - '.github/workflows/sprint_v68_spec.yml'
  pull_request:
  workflow_dispatch:

jobs:
  sprint-v68-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    env:
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Create database
        run: bundle exec rake db:create

      - name: Load schema
        run: bundle exec rake db:schema:load

      - name: Run sprint v68 specs
        run: |
          bundle exec rspec --format progress \
            spec/models/message_soft_delete_spec.rb \
            spec/services/channel_uazapi/revoke_message_service_spec.rb \
            spec/services/channel_uazapi/send_on_uazapi_service_spec.rb \
            spec/controllers/api/v1/accounts/conversations/messages_controller_destroy_spec.rb
