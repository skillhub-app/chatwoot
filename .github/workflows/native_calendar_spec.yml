name: Native Calendar Tools spec

permissions:
  contents: read

# Roda APENAS os specs da sprint de tools nativas de calendário (rápido).
# Não substitui nem toca o run_foss_spec.yml. Não gateia o deploy (workflow
# separado) — é um sinal de regressão pros arquivos desta feature.
on:
  push:
    branches:
      - main
    paths:
      - 'app/services/ai_agent/**'
      - 'app/controllers/api/v1/accounts/ai_agent_calendar_controller.rb'
      - 'app/controllers/google_calendar_callbacks_controller.rb'
      - 'app/models/ai_agent/tool.rb'
      - 'spec/services/ai_agent/**'
      - 'spec/controllers/api/v1/accounts/ai_agent_calendar_controller_spec.rb'
      - 'spec/controllers/google_calendar_callbacks_controller_spec.rb'
      - '.github/workflows/native_calendar_spec.yml'
  pull_request:
  workflow_dispatch:

jobs:
  native-calendar-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    env:
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Create database
        run: bundle exec rake db:create

      - name: Load schema
        run: bundle exec rake db:schema:load

      - name: Run native calendar specs
        run: |
          bundle exec rspec --format progress \
            spec/services/ai_agent/google_calendar/free_slots_finder_service_spec.rb \
            spec/services/ai_agent/google_calendar/event_creator_service_spec.rb \
            spec/services/ai_agent/google_calendar/event_canceler_service_spec.rb \
            spec/services/ai_agent/google_calendar/api_client_spec.rb \
            spec/services/ai_agent/google_calendar/primary_calendar_selector_service_spec.rb \
            spec/services/ai_agent/native_tool_registry_spec.rb \
            spec/services/ai_agent/native_tools_privacy_spec.rb \
            spec/services/ai_agent/tool_executor_spec.rb \
            spec/controllers/api/v1/accounts/ai_agent_calendar_controller_spec.rb \
            spec/controllers/google_calendar_callbacks_controller_spec.rb
